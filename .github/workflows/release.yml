name: Release

# 打 tag（v*）时构建可执行 jar 并创建 GitHub Release。
# 版本定版已完成：pom / Helm appVersion / 镜像 tag 均已从 1.0.0-SNAPSHOT 改为 1.0.0。
# 后续每次发布：先由发布指令把版本改为新值，再打同名 tag（首发 v1.0.0）。

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build fat jar
        run: mvn -B -DskipTests package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: jffast-boot/target/jffast-boot.jar
