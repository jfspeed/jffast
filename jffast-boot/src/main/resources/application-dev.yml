spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:jffast}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    # test1234 为统一测试填充值（与根 docker-compose.yml、README 说明保持一致）；
    # 仓库凭据扫描把它作为唯一白名单值，其他明文口令一律拒绝入库。生产必须注入真实强口令。
    password: ${MYSQL_PASSWORD:test1234}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      # 各应用独立 database，避免多应用共用同一套 Sa-Token 会话键空间
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:test1234}
  # 邮件通知通道（可选）：与 jffast.system.notification.channel.email.enabled 一起开启后，
  # 「通知管理 → 发送」可勾选邮件通道。不配置则邮件通道自动关闭。
  # mail:
  #   host: ${SMTP_HOST:smtp.example.com}
  #   port: ${SMTP_PORT:465}
  #   username: ${SMTP_USERNAME:}
  #   password: ${SMTP_PASSWORD:}
  #   properties:
  #     mail.smtp.ssl.enable: true

management:
  endpoints:
    web:
      exposure:
        # dev 额外开放指标端点；prod 仅保留 health,info（见 application-prod.yml）
        include: health,info,metrics,prometheus

logging:
  level:
    # 只开业务包 debug；不要写 cn.jfspeed: debug —— 那会连带打开框架内部
    # （MyBatis-Plus 参数输出、Sa-Token is-log、密钥相关 debug），
    # 登录/用户信息可能落到日志里。
    cn.jfspeed.system: debug

jffast:
  swagger:
    enabled: true
  # RSA 密钥对：用于登录、改密时密码的加密传输。
  # 仓库不存放密钥字面量（示例密钥入库 = 私钥永久泄露，git 历史不可逆）。
  # 未配置时由 RsaKeyInitializer 在启动时自动生成一次性密钥对并打印 WARN，
  # 前端通过 GET /sys/rsaPublicKey 动态取公钥，故无需手工同步。
  # 如需固定密钥（多实例 / prod），用 RsaKeyGenerator 生成后注入：
  #   RSA_PRIVATE_KEY=... RSA_PUBLIC_KEY=... （或写入不入库的 .env）
  rsa:
    private-key: ${RSA_PRIVATE_KEY:}
    public-key: ${RSA_PUBLIC_KEY:}
